  --cover: max(100vw / 1280, 100vh / 800);   /* photo's own scale - used by the tablet rail */
  --cream:#F7F5EF; --white:#F9F9F9; --ink:rgba(255,255,255,.88); --accent:#D6523A;
}

.frame{position:fixed;inset:0;overflow:hidden;background:#0a0b0c}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#0a0b0c}
.tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,
  rgba(0,0,0,0.118) 0%,
  rgba(0,0,0,0.092) 11%,
  rgba(0,0,0,0.083) 20%,
  rgba(0,0,0,0.079) 29%,
  rgba(0,0,0,0.014) 37.5%,
  rgba(0,0,0,0.016) 46%,
  rgba(0,0,0,0.043) 55%,
  rgba(0,0,0,0.058) 64%,
  rgba(0,0,0,0.062) 73%,
  rgba(0,0,0,0.080) 81%,
  rgba(0,0,0,0.090) 90%,
  rgba(0,0,0,0.095) 100%)}

.stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;
  margin:-400px 0 0 -640px;transform:scale(var(--s));transform-origin:50% 50%}

/* ---------- eyebrow ---------- */
.eyebrow{position:absolute;left:0;top:67.8px;width:1280px;margin:0;
  font:700 7.4px/7.4px UI,system-ui,sans-serif;
  word-spacing:0.522px;text-align:center;text-transform:uppercase;
  color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.eyebrow span{position:relative;display:block}
.eyebrow span{letter-spacing:2.252px;left:-0.9px}
.eyebrow{text-indent:2.252px}

/* ---------- headline ---------- */
.headline{position:absolute;left:0;top:0;width:1280px;margin:0;
  font:800 61.74px/61.74px Display,system-ui,sans-serif;
  word-spacing:2.691px;text-align:center;text-transform:uppercase;
  color:var(--cream);text-shadow:0 15px 36px rgba(0,0,0,0.50)}
.headline span{position:absolute;left:0;width:1280px;display:block;white-space:nowrap}
.headline .hl1{top:83.62px}
.headline .hl2{top:137.02px}
.headline .hl3{top:187.97px}
.headline .hl4{top:247.92px}
.headline .hl1{letter-spacing:-0.075px;left:0.45px}
.headline .hl2{letter-spacing:-1.237px}
.headline .hl3{letter-spacing:-0.237px;left:1.8px}
.headline .hl4{letter-spacing:-0.487px;left:1.35px}
.headline .hl1{text-indent:-0.075px} .headline .hl2{text-indent:-1.237px}
.headline .hl3{text-indent:-0.237px} .headline .hl4{text-indent:-0.487px}

/* ---------- accent mark ---------- */
.mark{position:absolute;left:549.5px;top:493.6px;
  width:52px;height:52px;overflow:visible}

/* ---------- features ---------- */
.feature{position:absolute;top:0}
.f-left {right:748.5px;text-align:right}
.f-right{left:748.5px;text-align:left}

.feature h2{position:absolute;top:617.68px;margin:0;
  font:700 19.57px/20px UI,system-ui,sans-serif;
  word-spacing:1.838px;text-transform:uppercase;color:var(--white);
  text-shadow:0 1px 4px rgba(0,0,0,.4)}
.f-left  h2{right:0} .f-right h2{left:0}
.feature p{position:absolute;top:681.9px;margin:0;
  font:400 12.28px/15.1px UI,system-ui,sans-serif;
  word-spacing:-0.194px;color:var(--ink);
  text-shadow:0 1px 3px rgba(0,0,0,.35)}
.f-left  p{right:12px} .f-right p{left:12px}
.feature h2 span,.feature p span{position:relative;display:block;white-space:nowrap}
.f-left  .t1{letter-spacing:-0.109px}
.f-left  .t2{letter-spacing:0.246px}
.f-right .t1{letter-spacing:-0.354px;left:-0.9px}
.f-right .t2{letter-spacing:-0.154px}
.f-left  .b1{letter-spacing:-0.097px;left:0.9px}
.f-left  .b2{letter-spacing:-0.271px;left:1.8px}
.f-left  .b3{letter-spacing:-0.161px;left:0.9px}
.f-right .b1{letter-spacing:-0.247px;left:-0.9px}
.f-right .b2{letter-spacing:-0.15px;left:-0.9px}
.f-right .b3{letter-spacing:-0.247px;left:-0.9px}

.icon{position:absolute;overflow:visible}
.f-left  .icon{right:-4.5px;top:549.5px;
  width:35px;height:34px}
.f-right .icon{left:-3px;top:547.5px;
  width:35px;height:38px}

/* ---------- entrance ---------------------------------------------------------
   One sequence, ~1.8s, then the page is completely still. The composition is
   built on the train's vertical axis and mirrored across it, so the motion is
   too: the eyebrow opens on the centre line, the headline resolves down it one
   masked line at a time, the ring settles onto the locomotive, and the two
   feature blocks arrive mirrored from either side of the rail. The photograph
   never moves - it is the stage, not a performer. Nothing loops, nothing waits
   on scroll, and every track resolves to transform:none / opacity:1. -------- */
@media (prefers-reduced-motion:no-preference){
  .eyebrow{animation:riseIn .55s cubic-bezier(.33,.9,.35,1) .15s both}

  .headline span{animation:lineIn .9s cubic-bezier(.16,1,.3,1) both}
  .headline .hl1{animation-delay:.28s}
  .headline .hl2{animation-delay:.37s}
  .headline .hl3{animation-delay:.46s}
  .headline .hl4{animation-delay:.55s}

  .mark{transform-origin:50% 50%;
    animation:markIn .7s cubic-bezier(.2,.9,.25,1) .72s both}

  .f-left {animation:blockInL .75s cubic-bezier(.16,1,.3,1) .82s both}
  .f-right{animation:blockInR .75s cubic-bezier(.16,1,.3,1) .90s both}
}

/* the headline reveals through its own line box: the mask edge travels down
   while the type rises the last fraction of an em into place */
@keyframes lineIn{
  0%  {opacity:0;transform:translateY(.26em);clip-path:inset(100% -30% 0% -30%)}
  35% {opacity:1}
  90% {clip-path:inset(0% -30% -100% -30%)}
  100%{opacity:1;transform:none;clip-path:inset(-80% -30% -100% -30%)}
}
@keyframes riseIn  {from{opacity:0;transform:translateY(6px)}       to{opacity:1;transform:none}}
@keyframes markIn  {from{opacity:0;transform:scale(.88)}            to{opacity:1;transform:none}}
@keyframes blockInL{from{opacity:0;transform:translate(-12px,8px)}  to{opacity:1;transform:none}}
@keyframes blockInR{from{opacity:0;transform:translate( 12px,8px)}  to{opacity:1;transform:none}}


/* ---------- tablet ----------------------------------------------------------
   The 1280x800 composition needs 716/800 = 0.895 of the viewport height in
   width just to hold its content, so below a square viewport its side margins
   collapse to zero. That - not a device width - is the breakpoint. Every
   landscape tablet (iPad 4:3 = 1.33, Surface 1.50) therefore keeps the desktop
   architecture with 168-276px margins; only portrait re-architects. Runs down to
   610px, where its own type floor is reached (see the phone block).
   Same composition, re-set for a tall frame: the two feature blocks stay
   mirrored across the train, which keeps the rail tied to the photo's own
   cover scale rather than to a fixed pixel gap. ------------------------------ */
@media (min-width:610px) and (max-aspect-ratio:1/1){
  :root{
    --u: min(100vw / 768, 100vh / 1024);
    --rail: clamp(120px, calc(var(--cover) * 219), 26vw);
  }
  .stage{position:absolute;inset:0;width:auto;height:auto;margin:0;transform:none;
    display:grid;
    grid-template-columns:1fr var(--rail) 1fr;
    grid-template-rows:auto auto 1fr auto auto minmax(0,.38fr);
    align-items:start;
    padding:calc(46 * var(--u)) clamp(24px,5.2vw,72px) calc(24 * var(--u))}

  .eyebrow,.headline,.feature,.feature h2,.feature p,.feature .icon{position:static}

  .eyebrow{grid-area:1/1/2/-1;width:auto;font-size:calc(11 * var(--u));line-height:1;
    letter-spacing:.304em;text-indent:.304em;word-spacing:.07em;
    margin-bottom:calc(20 * var(--u))}
  .stage .eyebrow span{position:static;left:auto;letter-spacing:inherit}

  .headline{grid-area:2/1/3/-1;width:auto;font-size:calc(84 * var(--u));
    line-height:.92;word-spacing:.0436em}
  .stage .headline span{position:static;width:auto;left:auto;top:auto;
    text-indent:0;letter-spacing:-.012em}

  .mark{grid-area:4/1/5/-1;justify-self:center;position:relative;left:auto;top:auto;right:5%;
    width:calc(64 * var(--u));height:calc(64 * var(--u));margin-bottom:calc(16 * var(--u))}

  .f-left {grid-area:5/1/6/2}
  .f-right{grid-area:5/3/6/4}

  .feature .icon{display:block;width:calc(42 * var(--u));height:calc(46 * var(--u));
    margin-bottom:calc(14 * var(--u))}
  .f-left  .icon{margin-left:auto;margin-right:calc(-4.5 * var(--u))}
  .f-right .icon{margin-right:auto;margin-left:calc(-3 * var(--u))}

  .feature h2{font-size:calc(22 * var(--u));line-height:1.08;word-spacing:.094em;
    margin-bottom:calc(12 * var(--u))}
  .stage .feature h2 span{white-space:normal;left:auto;letter-spacing:-.018em}

  .feature p{font-size:calc(14.5 * var(--u));line-height:1.34;word-spacing:-.016em;
    max-width:calc(310 * var(--u))}
  .f-left  p{margin-left:auto;margin-right:calc(10 * var(--u))}
  .f-right p{margin-right:auto;margin-left:calc(10 * var(--u))}
  .stage .feature p span{display:inline;white-space:normal;left:auto;letter-spacing:-.02em}
}

/* ---------- phone -----------------------------------------------------------
   The tablet grid stays readable a long way down: its type is derived from
   min(100vw/768, ...), so body copy only crosses below 11.5px at 609px, and its
   columns hold ~194px there. That is the breakpoint - not a device width.
   Below it the two columns cannot coexist: at even 430px each column is 144px,
   which breaks "FULL SUPPLY CHAIN" onto three lines and the paragraph onto four.
   So they unstack - but they keep the mirrored identity instead of collapsing to
   centre: block one stays right-aligned with its icon on the inner edge, block
   two stays left-aligned, each paragraph hugging the train's axis, and the accent
   ring stays on that axis between the headline and the features. -------------- */
@media (max-width:609px){
  .frame{height:100vh;height:100dvh}
  :root{
    --u:min(100vw / 390, 100vh / 780);
    --u:min(100vw / 390, 100dvh / 780);
  }
  .stage{position:absolute;inset:0;width:auto;height:auto;margin:0;transform:none;
    display:grid;grid-template-columns:100%;
    grid-template-rows:auto auto 1fr auto auto auto minmax(0,.3fr);
    align-items:start;
    padding:calc(30 * var(--u))
            max(calc(22 * var(--u)),env(safe-area-inset-right))
            max(calc(32 * var(--u)),env(safe-area-inset-bottom))
            max(calc(22 * var(--u)),env(safe-area-inset-left))}

  .eyebrow,.headline,.feature,.feature h2,.feature p,.feature .icon{position:static}

  .eyebrow{grid-row:1;width:auto;line-height:1;
    font-size:clamp(8px,calc(9.5 * var(--u)),11px);
    letter-spacing:.304em;text-indent:.304em;word-spacing:.07em;
    margin-bottom:calc(16 * var(--u))}
  .stage .eyebrow span{position:static;left:auto;letter-spacing:inherit}

  .headline{grid-row:2;width:auto;line-height:.92;word-spacing:.0436em;
    font-size:clamp(26px,min(11.6vw,calc(52 * var(--u))),64px)}
  .stage .headline span{position:static;width:auto;left:auto;top:auto;
    text-indent:0;letter-spacing:-.012em}

  .mark{grid-row:4;justify-self:center;position:relative;left:auto;top:auto;right:5%;
    width:clamp(38px,calc(46 * var(--u)),54px);
    height:clamp(38px,calc(46 * var(--u)),54px);
    margin-bottom:calc(18 * var(--u))}

  .f-left {grid-row:5;margin-bottom:calc(26 * var(--u))}
  .f-right{grid-row:6}

  .feature .icon{display:block;margin-bottom:calc(10 * var(--u));
    width:clamp(26px,calc(34 * var(--u)),40px);
    height:clamp(28px,calc(37 * var(--u)),43px)}
  .f-left  .icon{margin-left:auto;margin-right:calc(-4 * var(--u))}
  .f-right .icon{margin-right:auto;margin-left:calc(-3 * var(--u))}

  .feature h2{line-height:1.08;word-spacing:.094em;margin-bottom:calc(8 * var(--u));
    font-size:clamp(15px,calc(17 * var(--u)),20px)}
  .stage .feature h2 span{white-space:normal;left:auto;letter-spacing:-.018em}

  .feature p{line-height:1.36;word-spacing:-.016em;max-width:calc(320 * var(--u));
    font-size:clamp(11.5px,calc(13.5 * var(--u)),14.5px)}
  .f-left  p{margin-left:auto}
  .f-right p{margin-right:auto}
  .stage .feature p span{display:inline;white-space:normal;left:auto;letter-spacing:-.02em}
}
</style>
</head>
